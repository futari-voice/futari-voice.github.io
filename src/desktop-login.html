<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>なかまボイス ログイン</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(800px 500px at 0% 0%,rgba(139,92,246,.35),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(34,211,238,.22),transparent 60%),#0b0c1b;color:#e3e5ff;font:15px/1.5 "Noto Sans JP","Segoe UI","Meiryo",system-ui,sans-serif}
.card{width:min(440px,100%);background:rgba(20,22,46,.85);border:1px solid rgba(139,92,246,.35);border-radius:22px;padding:32px;display:grid;gap:16px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.logo{width:64px;height:64px;border-radius:22px;background:linear-gradient(135deg,#8b5cf6,#6366f1 48%,#22d3ee);box-shadow:0 10px 30px rgba(124,58,237,.5);display:grid;place-items:center;margin:0 auto}
.logo svg{width:40px;height:40px;stroke:#fff;fill:none;stroke-width:2.2}
h1{margin:0;color:#fff;font-size:24px}
p{margin:0;color:#c3c6ea}
button,a.btn{height:46px;border:0;border-radius:12px;background:#fff;color:#1f1f1f;font:inherit;font-weight:700;font-size:15.5px;cursor:pointer;display:grid;place-items:center;text-decoration:none}
a.btn{background:linear-gradient(135deg,#8b5cf6,#6366f1 48%,#22d3ee);color:#fff}
button:disabled{opacity:.6;cursor:wait}
#msg:empty{display:none}
.err{color:#fa777c!important}
</style>
</head>
<body>
<main class="card">
  <div class="logo"><svg viewBox="0 0 24 24" style="stroke-linecap:round;stroke-linejoin:round"><path d="M6.5 3h11A2.5 2.5 0 0 1 20 5.5v8A2.5 2.5 0 0 1 17.5 16H11l-4.5 4v-4A2.5 2.5 0 0 1 4 13.5v-8A2.5 2.5 0 0 1 6.5 3z"/><path d="M9 7.5v4M12 6v7M15 7.5v4"/></svg></div>
  <h1 id="ttl">アプリにログイン</h1>
  <p id="lead">Googleアカウントをえらんでね。終わったら、なかまボイスのアプリにもどるよ。</p>
  <button id="go" type="button">Googleでログイン</button>
  <p id="msg"></p>
  <a class="btn" id="back" href="#" hidden>なかまボイスを開く</a>
</main>
<script>/*@@FIREBASE@@*/</script>
<script>window.FV_FIREBASE = /*@@FBCONFIG@@*/null;</script>
<script>
{
  const $ = s => document.querySelector(s);
  const q = new URLSearchParams(location.search);
  const state = q.get('state') || '';
  const android = q.get('p') === 'android';
  const appName = android ? 'Androidアプリ' : 'Windowsアプリ';
  $('#ttl').textContent = appName + 'にログイン';
  const say = (t, bad) => { $('#msg').textContent = t; $('#msg').classList.toggle('err', !!bad); };
  const cfg = q.get('emu') ? {apiKey:'demo-key', authDomain:'demo-futari.firebaseapp.com', projectId:'demo-futari', appId:'demo'} : window.FV_FIREBASE;
  let auth = null;
  if (!/^[a-z0-9]{16,64}$/.test(state)){ $('#go').disabled = true; say('このページは、なかまボイスのアプリから開いてね。', true); }
  else if (!window.FB || !cfg){ $('#go').disabled = true; say('ログインのしくみの設定が、まだないよ。', true); }
  else {
    auth = FB.getAuth(FB.initializeApp(cfg));
    auth.languageCode = 'ja';
    if (q.get('emu')) FB.connectAuthEmulator(auth, 'http://' + q.get('emu'), {disableWarnings:true});
    FB.getRedirectResult(auth).then(res => { if (res) finish(res); }).catch(fail);
  }
  async function finish(res){
    const cred = FB.GoogleAuthProvider.credentialFromResult(res);
    if (!cred || !cred.idToken) throw new Error('no token');
    try { await FB.signOut(auth); } catch(e){}      // このブラウザにはログインを残さない
    const qp = 'state=' + state + '&id_token=' + encodeURIComponent(cred.idToken);
    const url = android ? 'intent://auth?' + qp + '#Intent;scheme=futarivoice;package=app.futarivoice.twa;end' : 'futarivoice://auth?' + qp;
    $('#back').href = url; $('#back').hidden = false; $('#go').hidden = true;
    $('#lead').textContent = 'ログインできたよ！';
    say(android ? '下の「なかまボイスを開く」をおしてね。' : 'ブラウザが「なかまボイスを開く？」と聞いてきたら「開く」をおしてね。何も起きなければ、下のボタンをおしてね。');
    location.href = url;
  }
  function fail(e){
    $('#go').disabled = false;
    say(e && e.code === 'auth/popup-closed-by-user' ? 'ログインの窓がとじられたよ。もう一度ためしてね。' : 'ログインできなかった…（' + ((e && (e.code || e.message)) || '') + '）', true);
  }
  $('#go').onclick = async () => {
    $('#go').disabled = true; say('');
    const prov = new FB.GoogleAuthProvider(); prov.setCustomParameters({prompt:'select_account'});
    try { await finish(await FB.signInWithPopup(auth, prov)); }
    catch(e){
      if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')){ try { await FB.signInWithRedirect(auth, prov); return; } catch(e2){ fail(e2); return; } }
      fail(e);
    }
  };
}
</script>
</body>
</html>
