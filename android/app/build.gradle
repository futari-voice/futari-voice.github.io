// ふたりボイス Android版（Trusted Web Activity：中身は公開しているWebアプリ、Chromeのしくみで動く）
plugins { id 'com.android.application' }

def host = System.getenv('TWA_HOST') ?: 'example.github.io'
def base = System.getenv('TWA_BASE') ?: ''        // GitHub Pages のフォルダ（例: /futari-voice）。ルートなら空
def assetStatements = '[{\\"relation\\": [\\"delegate_permission/common.handle_all_urls\\"], \\"target\\": {\\"namespace\\": \\"web\\", \\"site\\": \\"https://' + host + '\\"}}]'

android {
    namespace 'app.futarivoice.twa'
    compileSdk 35
    defaultConfig {
        applicationId 'app.futarivoice.twa'
        minSdk 24
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName System.getenv('VERSION_NAME') ?: '1.0.0'
        manifestPlaceholders = [hostName: host, pathPrefix: "${base}/app", defaultUrl: "https://${host}${base}/app/"]
        resValue 'string', 'assetStatements', assetStatements
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'missing.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('KEY_ALIAS') ?: 'futarivoice'
            keyPassword System.getenv('KEY_PASSWORD') ?: (System.getenv('KEYSTORE_PASSWORD') ?: '')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
