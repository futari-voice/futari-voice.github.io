// ふたりボイス Android版（アプリの中で、公開しているWebアプリを開く。通話中はうしろでも止まらない）
plugins { id 'com.android.application' }

def host = System.getenv('TWA_HOST') ?: 'example.github.io'
def base = System.getenv('TWA_BASE') ?: ''        // GitHub Pages のフォルダ（例: /futari-voice）。ルートなら空

android {
    namespace 'app.futarivoice.twa'
    compileSdk 35
    defaultConfig {
        applicationId 'app.futarivoice.twa'       // 前のバージョンの上に入れられるように、名前は同じまま
        minSdk 24
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName System.getenv('VERSION_NAME') ?: '1.0.0'
        manifestPlaceholders = [hostName: host, pathPrefix: "${base}/app"]
        buildConfigField 'String', 'SITE_HOST', "\"${host}\""
        buildConfigField 'String', 'BASE', "\"${base}\""
        buildConfigField 'String', 'APP_URL', "\"https://${host}${base}/app/\""
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'missing.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('KEY_ALIAS') ?: 'futarivoice'
            keyPassword System.getenv('KEY_PASSWORD') ?: (System.getenv('KEYSTORE_PASSWORD') ?: '')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
